# --- SonarCloud : projet unique couvrant back (Java) + front (Angular) ---
# À ADAPTER à ce que SonarCloud affiche après l'import du repo :
sonar.projectKey=Nicooo67_coordination
sonar.organization=nicooo67
sonar.projectName=coordination

# Sources et tests (monorepo polyglotte : test.inclusions départage le classement)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.cy.ts,**/*Test.java,**/*Tests.java
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/.angular/**,**/coverage/**

# Backend Java – binaires compilés + couverture JaCoCo
sonar.java.binaries=backend_spring/target/classes
sonar.java.test.binaries=backend_spring/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend_spring/target/site/jacoco/jacoco.xml

# Frontend TS – couverture Jest (lcov)
sonar.javascript.lcov.reportPaths=frontend_note/coverage/lcov.info

sonar.sourceEncoding=UTF-8
