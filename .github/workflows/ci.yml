name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  backend:
    name: Backend (Spring) – build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_spring
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Build & test (mvn verify)
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Angular) – build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_note
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_note/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Jest)
        run: npm test -- --ci

      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Cypress) – backend + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Start backend (Spring Boot) in background
        working-directory: backend_spring
        run: ./mvnw -B -DskipTests spring-boot:run &

      - name: Wait for backend to listen on :8080
        run: npx --yes wait-on -t 120000 tcp:127.0.0.1:8080

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_note/package-lock.json

      - name: Run Cypress (starts ng serve, waits, then cypress run)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend_note
          start: npm start
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
